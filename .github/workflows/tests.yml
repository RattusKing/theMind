# Runs on every push to main and every pull request. Not for contributors:
# for the build's own integrity, so a slip is caught the day it happens.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runner: [ubuntu-latest]
        include:
          # The newest runner image has no Python 3.9 build, and 3.9 is still
          # the oldest Python theMind promises, so it runs where it is built.
          - python: "3.9"
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: test suite
        run: python tests/run_all.py
      - name: continuity benchmark
        run: python -m themind.bench

  ros2:
    # The ROS 2 add-on, end to end on real ROS 2: built with colcon, the
    # bridge run beside a simulated robot, and what the mind lived checked.
    name: ROS 2 (Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v5
      - name: the bridge beside a simulated robot
        shell: bash
        run: ros2/live_check.sh

  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit message, not just the last
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: retired name, pure stdlib, zero dependencies
        env:
          THEMIND_GUARD_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: python tests/guards.py
